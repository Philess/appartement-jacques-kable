name: Deploy GitHub Pages manually

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode (release requires complete publication settings)
        required: true
        type: choice
        default: release
        options:
          - release
          - preview
      public_preview_confirmation:
        description: 'For preview only, type: public preview, noindex is not access control'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate publication intent and configuration
        run: node scripts/pages-build.mjs --check
        env:
          PAGES_BUILD_MODE: ${{ inputs.mode }}
          PUBLIC_PREVIEW_CONFIRMATION: ${{ inputs.public_preview_confirmation }}
      # Pages must already be enabled on an eligible plan/repository.
      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build the selected mode
        id: build
        run: node scripts/pages-build.mjs
        env:
          PAGES_BUILD_MODE: ${{ inputs.mode }}
          PUBLIC_PREVIEW_CONFIRMATION: ${{ inputs.public_preview_confirmation }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload only the static build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.build.outputs.artifact_path }}
          include-hidden-files: false
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
